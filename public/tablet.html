<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex, nofollow" />
<!-- Página interna: fuera del índice de Google. La etiqueta va aquí
     y no en robots.txt a propósito -- ver el comentario de ese archivo. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>White Bear Restaurant — Reservations Panel</title>
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/tablet.css" />
</head>
<body class="tablet-body">

<canvas id="bg-3d" class="bg-3d" aria-hidden="true"></canvas>

<header class="tablet-header">
  <div class="tablet-header-left">
    <!-- Marca reducida, no el disco completo: a 42px el texto del logo es una
         mancha, y además el nombre ya está escrito al lado. -->
    <div class="brand-icon"><img src="images/bear-mark.jpg" alt="White Bear Restaurant" class="brand-icon-img"></div>
    <div class="tablet-brand-text">
      <h1>White Bear</h1>
      <div id="clock" class="clock">--:--</div>
    </div>
  </div>
  <div class="tablet-header-right">
    <div class="stat">
      <span class="stat-value" id="stat-total">0</span>
      <span class="stat-label" data-i18n="header.reservations">reservations</span>
    </div>
    <div class="stat">
      <span class="stat-value" id="stat-guests">0</span>
      <span class="stat-label" data-i18n="header.guests">guests</span>
    </div>
    <div class="lang-switcher" id="lang-switcher">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="es">ES</button>
      <button type="button" data-lang="sr">SR</button>
    </div>
    <button class="btn btn-refresh" id="refresh-btn" data-i18n-title="header.refresh" title="Refresh now">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
    </button>
  </div>
</header>

<nav class="view-tabs" id="view-tabs">
  <button type="button" class="view-tab active" data-view="reservations" data-i18n="views.reservations">Reservations</button>
  <button type="button" class="view-tab" data-view="tables" data-i18n="views.tables">Tables</button>

  <!-- Alta rápida de reserva, para cuando entra una llamada. Abre un
       recuadro anclado a este botón, no una pantalla completa: el personal
       sigue viendo la lista del turno detrás mientras apunta. -->
  <div class="new-res-wrap">
    <button type="button" class="btn-new-res" id="new-res-btn" aria-expanded="false" aria-controls="new-res-popover">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg>
      <span data-i18n="newRes.open">New reservation</span>
    </button>

    <div class="new-res-popover" id="new-res-popover" role="dialog" aria-modal="false"
         aria-labelledby="new-res-title" hidden>
      <p class="new-res-title" id="new-res-title" data-i18n="newRes.title">New reservation</p>
      <form id="new-res-form" novalidate>
        <div class="new-res-grid">
          <label class="new-res-field new-res-field--full">
            <span data-i18n="newRes.name">Name</span>
            <input type="text" name="name" required autocomplete="off" />
          </label>
          <label class="new-res-field new-res-field--full">
            <span data-i18n="newRes.phone">Phone</span>
            <input type="tel" name="phone" required autocomplete="off" />
          </label>
          <label class="new-res-field">
            <span data-i18n="newRes.date">Date</span>
            <input type="date" name="date" required />
          </label>
          <label class="new-res-field">
            <span data-i18n="newRes.time">Time</span>
            <input type="time" name="time" required step="900" />
          </label>
          <label class="new-res-field">
            <span data-i18n="newRes.partySize">Guests</span>
            <input type="number" name="partySize" min="1" max="40" value="2" required />
          </label>
          <label class="new-res-field">
            <span data-i18n="newRes.seating">Seating</span>
            <select name="seatingPreference">
              <option value="" data-i18n="newRes.seatingNone">No preference</option>
              <option value="inside" data-i18n="newRes.seatingInside">Inside</option>
              <option value="outside" data-i18n="newRes.seatingOutside">Outside</option>
            </select>
          </label>
          <label class="new-res-field new-res-field--full">
            <span data-i18n="newRes.notes">Notes</span>
            <input type="text" name="notes" autocomplete="off" />
          </label>
        </div>
        <div class="new-res-alert" id="new-res-alert" hidden></div>
        <div class="new-res-actions">
          <button type="button" class="btn-ghost" id="new-res-cancel" data-i18n="newRes.cancel">Cancel</button>
          <button type="submit" class="btn-save" id="new-res-save" data-i18n="newRes.save">Save</button>
        </div>
      </form>
    </div>
  </div>
</nav>

<section id="reservations-view">
  <nav class="tabs">
    <button class="tab active" data-filter="today" data-i18n="tabs.today">Today</button>
    <button class="tab" data-filter="upcoming" data-i18n="tabs.upcoming">Upcoming</button>
    <button class="tab" data-filter="all" data-i18n="tabs.all">All</button>
    <div class="tab-spacer"></div>
    <button class="tab status-tab" data-status="pending" data-i18n="tabs.pending">Pending</button>
    <button class="tab status-tab" data-status="confirmed" data-i18n="tabs.confirmed">Confirmed</button>
    <button class="tab status-tab active" data-status="active" data-i18n="tabs.active">Unfinished</button>
    <button class="tab status-tab" data-status="needs-call">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18M12 7.5V12l3 2"/></svg>
      <span data-i18n="tabs.needsCall">Needs confirmation</span>
    </button>
  </nav>

  <main id="list-container" class="list-container">
    <div class="empty-state" id="empty-state">
      <div class="empty-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 11h16a8 8 0 0 1-16 0M12 4v3M5.5 20h13"/></svg>
      </div>
      <p data-i18n="emptyState">No reservations to show.</p>
    </div>
    <div id="reservation-list"></div>
  </main>
</section>

<section id="tables-view" hidden>
  <div class="tables-summary" id="tables-summary"></div>
  <p class="tables-hint" data-i18n="tables.hint">Mark a table unavailable to take it out of service.</p>
  <div class="floor-legend">
    <span class="floor-legend-item"><i class="floor-swatch available"></i><span data-i18n="tables.available">Available</span></span>
    <span class="floor-legend-item"><i class="floor-swatch unavailable"></i><span data-i18n="tables.unavailable">Unavailable</span></span>
  </div>
  <div class="floor-plan" id="floor-plan"></div>
</section>

<div class="toast" id="toast"></div>

<!-- Pantalla de acceso del staff. Tapa todo el panel hasta que se entra
     con la contraseña (STAFF_PASSWORD en el servidor); ver staff-auth.js. -->
<div class="staff-login" id="staff-login" role="dialog" aria-modal="true" aria-labelledby="staff-login-title" hidden>
  <form class="staff-login-card" id="staff-login-form" novalidate>
    <img src="images/bear-logo.jpg" alt="" class="staff-login-logo" />
    <h2 class="staff-login-title" id="staff-login-title" data-i18n="login.title">Staff access</h2>
    <p class="staff-login-hint" data-i18n="login.hint">Enter the staff password to see reservations.</p>
    <label class="new-res-field new-res-field--full">
      <span data-i18n="login.password">Password</span>
      <input type="password" id="staff-login-password" autocomplete="current-password" required />
    </label>
    <div class="new-res-alert" id="staff-login-alert" role="alert" hidden></div>
    <button type="submit" class="btn-save staff-login-submit" data-i18n="login.submit">Sign in</button>
  </form>
</div>

<script src="js/bg-3d.js" defer></script>
<script src="js/tablet-i18n.js"></script>
<script src="js/staff-auth.js"></script>
<script src="js/tablet.js"></script>
</body>
</html>
