name: Respaldo diario

# Copia todos los datos de Supabase cada noche y la guarda, cifrada, como
# artefacto de GitHub durante 90 días. Ver OPERACION.md, sección "Respaldos".
#
# El repositorio es público: el archivo SIEMPRE se cifra antes de subirlo,
# porque lleva nombres y teléfonos de clientes. Sin BACKUP_PASSPHRASE el
# trabajo se detiene en vez de subir nada sin cifrar.

on:
  schedule:
    - cron: "17 8 * * *" # 08:17 UTC = 4:17 o 3:17 de la madrugada en Lake Placid
  workflow_dispatch:

permissions:
  contents: read

jobs:
  respaldo:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Comprobar configuración
        id: config
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::warning::Faltan los secretos SUPABASE_URL, SUPABASE_KEY o BACKUP_PASSPHRASE; no se hace respaldo. Ver OPERACION.md."
            echo "listo=no" >> "$GITHUB_OUTPUT"
          else
            echo "listo=si" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.listo == 'si'
      - uses: actions/setup-python@v5
        if: steps.config.outputs.listo == 'si'
        with:
          python-version: "3.13"
      - name: Exportar y cifrar
        if: steps.config.outputs.listo == 'si'
        run: |
          umask 077
          python scripts/backup.py respaldo.json
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in respaldo.json -out respaldo.json.enc -pass env:BACKUP_PASSPHRASE
          shred -u respaldo.json
      - uses: actions/upload-artifact@v4
        if: steps.config.outputs.listo == 'si'
        with:
          name: respaldo-${{ github.run_id }}
          path: respaldo.json.enc
          retention-days: 90
          if-no-files-found: error
